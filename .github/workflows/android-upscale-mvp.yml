name: WhiteFlood Android Pilot APK

on:
  push:
    branches:
      - feat/android-upscale-mvp
    paths:
      - 'android/**'
      - '.github/workflows/android-upscale-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteflood-android-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/tumuyan/RealSR-NCNN-Android.git
  UPSTREAM_SHA: 0eb16763761e46f55c6223439ca1ad20216bc4ab
  ASSETS_URL: https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip
  NCNN_URL: https://github.com/Tencent/ncnn/releases/download/20250503/ncnn-20250503-android-vulkan-shared.zip

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout WhiteFlood
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Fetch pinned Android engine source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream fetch --depth=1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Fetch pinned engine assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ASSETS_URL" --output assets.zip
          curl --fail --location --retry 3 "$NCNN_URL" --output ncnn-android-vulkan-shared.zip
          sha256sum assets.zip ncnn-android-vulkan-shared.zip | tee dependency-sha256.txt
          mkdir -p upstream/3rdparty
          unzip -q -o assets.zip -d upstream/RealSR-NCNN-Android-GUI/app/src/main/assets
          unzip -q -o ncnn-android-vulkan-shared.zip -d upstream/3rdparty/ncnn-android-vulkan-shared

      - name: Apply WhiteFlood Android overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 android/apply_whiteflood_overlay.py \
            --upstream-root upstream \
            --overlay-root android/overlay

      - name: Build debug APK
        shell: bash
        working-directory: upstream/RealSR-NCNN-Android-GUI
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find upstream/RealSR-NCNN-Android-GUI/app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            printf 'Expected exactly one APK, found %s\n' "${#APK_FILES[@]}" >&2
            printf '%s\n' "${APK_FILES[@]}" >&2
            exit 1
          fi

          mkdir -p artifacts
          APK_OUT="artifacts/WhiteFlood-Android-Pilot-v0.1.0.apk"
          cp "${APK_FILES[0]}" "$APK_OUT"
          sha256sum "$APK_OUT" | tee artifacts/WhiteFlood-Android-Pilot-v0.1.0.sha256

          APK_SHA=$(sha256sum "$APK_OUT" | awk '{print $1}')
          APK_SIZE=$(stat -c '%s' "$APK_OUT")
          DEP_ASSETS_SHA=$(awk '$2 == "assets.zip" {print $1}' dependency-sha256.txt)
          DEP_NCNN_SHA=$(awk '$2 == "ncnn-android-vulkan-shared.zip" {print $1}' dependency-sha256.txt)

          python3 - "$APK_SHA" "$APK_SIZE" "$DEP_ASSETS_SHA" "$DEP_NCNN_SHA" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          apk_sha, apk_size, assets_sha, ncnn_sha = sys.argv[1:]
          evidence = {
              "schema_version": 1,
              "project": "WhiteFlood",
              "artifact": "WhiteFlood-Android-Pilot-v0.1.0.apk",
              "artifact_sha256": apk_sha,
              "artifact_size_bytes": int(apk_size),
              "source_revision": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF"],
              "runner": "ubuntu-24.04",
              "build_command": "./gradlew --no-daemon --stacktrace assembleDebug",
              "upstream": {
                  "repository": "tumuyan/RealSR-NCNN-Android",
                  "commit": os.environ["UPSTREAM_SHA"],
                  "release_assets": "1.11.1/assets.zip",
                  "assets_sha256": assets_sha,
              },
              "ncnn": {
                  "release": "20250503",
                  "package": "ncnn-20250503-android-vulkan-shared.zip",
                  "sha256": ncnn_sha,
              },
              "scope": ["android-arm64-pilot", "local-upscale", "2x", "4x"],
              "runtime_device_verified": False,
          }
          out = Path("artifacts/evidence.json")
          out.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          Path("artifacts/evidence.md").write_text(
              "# WhiteFlood Android Pilot Build Evidence\n\n"
              f"- Revision: `{evidence['source_revision']}`\n"
              f"- Upstream: `{evidence['upstream']['commit']}`\n"
              f"- APK SHA-256: `{apk_sha}`\n"
              f"- APK bytes: `{apk_size}`\n"
              "- CI build: PASS\n"
              "- Physical Android runtime: PENDING\n",
              encoding="utf-8",
          )
          PY
          cp dependency-sha256.txt artifacts/dependency-sha256.txt
          ls -lh artifacts

      - name: Upload APK evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhiteFlood-Android-Pilot-v0.1.0
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
