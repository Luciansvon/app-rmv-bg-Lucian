name: Publish WhiteFlood Android v0.1.0

on:
  push:
    branches:
      - feat/android-upscale-mvp
    paths:
      - .github/workflows/android-publish-v0.1.0.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: "34489462302"
      ARTIFACT_NAME: WhiteFlood-Android-Pilot-v0.1.0
      RELEASE_TAG: android-v0.1.0
      RELEASE_TARGET: 9ee1790bfea0e15c2b441d3154c27a71f3fcb079
    steps:
      - name: Download verified APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download "$BUILD_RUN_ID" \
            --repo "$GH_REPO" \
            --name "$ARTIFACT_NAME" \
            --dir release-artifact
          test -f release-artifact/WhiteFlood-Android-Pilot-v0.1.0.apk
          test -f release-artifact/WhiteFlood-Android-Pilot-v0.1.0.sha256
          test -f release-artifact/evidence.md
          sha256sum -c release-artifact/WhiteFlood-Android-Pilot-v0.1.0.sha256

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## WhiteFlood Android Pilot v0.1.0

          Android pilot pertama WhiteFlood untuk **upscale foto lokal di perangkat**.

          ### Fitur pilot
          - Upscale foto **2x** dan **4x**.
          - Engine **Real-ESRGAN / NCNN** dengan jalur Vulkan pada perangkat yang mendukung.
          - Pemrosesan lokal, tanpa upload foto ke server.
          - UI mobile WhiteFlood dengan alur pilih foto → upscale → simpan hasil.
          - Build Android arm64 dari source engine yang dipin ke commit tertentu.

          ### Verifikasi
          - GitHub Actions build: **PASS** pada run `34489462302`.
          - APK SHA-256: `3e1aed24d4fcc31ce4960a202b194a0ee9c0915b5026cc495d0f018224439b77`.
          - Dependency checksum dan build evidence disertakan sebagai asset release.

          ### Batas pilot
          - Belum diuji pada perangkat Android fisik dalam workflow ini.
          - Fokus v0.1.0 hanya Upscale; fitur WhiteFlood desktop lain belum dipindahkan ke Android.
          - Ukuran APK besar karena engine/model lokal dibundel agar pemrosesan tetap offline.

          **Built by Bima Chakti**  
          © 2026 Bima Chakti
          EOF

      - name: Publish GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            release-artifact/WhiteFlood-Android-Pilot-v0.1.0.apk \
            release-artifact/WhiteFlood-Android-Pilot-v0.1.0.sha256 \
            release-artifact/dependency-sha256.txt \
            release-artifact/evidence.json \
            release-artifact/evidence.md \
            --repo "$GH_REPO" \
            --target "$RELEASE_TARGET" \
            --title "WhiteFlood Android Pilot v0.1.0" \
            --notes-file release-notes.md \
            --prerelease
