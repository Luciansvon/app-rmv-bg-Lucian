name: WhiteFlood Windows Watermark Creator RC

on:
  push:
    branches:
      - feat/issue-7-watermark-creator
    paths:
      - 'review-temp/WhiteFlood_BG_Remover_App/**'
      - 'tests/**'
      - '.github/workflows/windows-watermark-creator-rc.yml'
      - 'implementation_plan.md'
      - 'user.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteflood-windows-watermark-creator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify and build Windows RC
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout source including Git LFS runtime binaries
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: review-temp/WhiteFlood_BG_Remover_App/requirements.txt

      - name: Install declared build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r review-temp/WhiteFlood_BG_Remover_App/requirements.txt
          python -m pip install "pyinstaller>=6.0"

      - name: Compile changed Python sources
        shell: pwsh
        run: |
          python -m py_compile `
            review-temp/WhiteFlood_BG_Remover_App/whiteflood_app_issue7.py `
            review-temp/WhiteFlood_BG_Remover_App/features/watermark_creator/__init__.py `
            review-temp/WhiteFlood_BG_Remover_App/features/watermark_creator/visible.py `
            review-temp/WhiteFlood_BG_Remover_App/features/watermark_creator/invisible.py `
            review-temp/WhiteFlood_BG_Remover_App/features/watermark_creator/presets.py `
            review-temp/WhiteFlood_BG_Remover_App/features/watermark_creator/service.py `
            review-temp/WhiteFlood_BG_Remover_App/features/watermark_creator/benchmark.py `
            review-temp/WhiteFlood_BG_Remover_App/features/watermark_creator/ui.py

      - name: Run repository regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m unittest discover -s tests -v 2>&1 | Tee-Object artifacts/tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build windowed EXE in isolated staging paths
        shell: pwsh
        env:
          WHITEFLOOD_DIST_PATH: ${{ github.workspace }}\artifacts\dist
          WHITEFLOOD_WORK_PATH: ${{ github.workspace }}\artifacts\build
          WHITEFLOOD_SPEC_PATH: ${{ github.workspace }}\artifacts\spec
        run: |
          python review-temp/WhiteFlood_BG_Remover_App/build_exe.py 2>&1 | Tee-Object artifacts/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Produce BIMA evidence bundle
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts\dist\WhiteFlood_BG_Remover.exe'
          if (-not (Test-Path $exe)) { throw "Expected EXE not found: $exe" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  WhiteFlood_BG_Remover.exe" | Set-Content -Encoding ascii artifacts\WhiteFlood_BG_Remover.sha256
          python -c "import json,os,pathlib,platform; p=pathlib.Path(r'artifacts/dist/WhiteFlood_BG_Remover.exe'); h=pathlib.Path(r'artifacts/WhiteFlood_BG_Remover.sha256').read_text().split()[0]; d={'schema_version':1,'project':'WhiteFlood','feature':'Issue #7 Hybrid Watermark Creator','artifact':p.name,'artifact_sha256':h,'artifact_size_bytes':p.stat().st_size,'source_revision':os.environ['GITHUB_SHA'],'source_ref':os.environ['GITHUB_REF'],'runner':'windows-2025','python':platform.python_version(),'checks':{'py_compile':'PASS','unittest':'PASS','pyinstaller_package':'PASS','gui_runtime':'UNKNOWN','office_pc_runtime':'UNKNOWN','real_image_invisible_corpus':'UNKNOWN'},'invisible_watermark_status':'experimental','release_authorized':False}; pathlib.Path(r'artifacts/evidence.json').write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8'); pathlib.Path(r'artifacts/evidence.md').write_text(f'# WhiteFlood Windows v2.7.0-rc1 Evidence\n\n- Revision: `{d[\"source_revision\"]}`\n- Runner: `{d[\"runner\"]}`\n- Python: `{d[\"python\"]}`\n- EXE bytes: `{d[\"artifact_size_bytes\"]}`\n- EXE SHA-256: `{d[\"artifact_sha256\"]}`\n- Syntax: PASS\n- Repository tests: PASS\n- PyInstaller package: PASS\n- GUI runtime: UNKNOWN\n- Office PC runtime: UNKNOWN\n- Invisible real-image corpus: UNKNOWN\n- Invisible status: experimental\n- Release authorization: false\n',encoding='utf-8')"
          Get-ChildItem artifacts\dist
          Get-Content artifacts\evidence.md

      - name: Upload Windows RC evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WhiteFlood-Windows-v2.7.0-rc1-${{ github.sha }}
          path: |
            artifacts/dist/WhiteFlood_BG_Remover.exe
            artifacts/WhiteFlood_BG_Remover.sha256
            artifacts/evidence.json
            artifacts/evidence.md
            artifacts/tests.txt
            artifacts/build.txt
          if-no-files-found: error
          retention-days: 14
